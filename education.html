<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Career Axis — Educational Planning Platform</title>

  <!-- OnlineWebFonts: HelveticaNowDisplay -->
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" type="text/css">
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" type="text/css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['var(--font-heading)'],
            body: ['var(--font-body)']
          },
          animation: {
            blink: 'blink 1s step-end infinite'
          },
          keyframes: {
            blink: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0' }
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      font-family: var(--font-body);
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .cursor-blink {
      animation: blink 1s step-end infinite;
    }

    /* Fixed full-screen video */
    .bg-video-scrub {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: 70% center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const videoRef = useRef(null);
      const prevXRef = useRef(null);
      const isSeekingRef = useRef(false);
      const targetTimeRef = useRef(0);

      // Mouse-scrub video logic
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        // Load first frame
        const handleLoadedMetadata = () => {
          video.currentTime = 0.001;
        };
        video.addEventListener('loadedmetadata', handleLoadedMetadata);
        if (video.readyState >= 1) {
          video.currentTime = 0.001;
        }

        const applySeek = () => {
          if (!video || !video.duration || isSeekingRef.current) return;
          if (Math.abs(video.currentTime - targetTimeRef.current) > 0.02) {
            isSeekingRef.current = true;
            video.currentTime = targetTimeRef.current;
          }
        };

        const handleSeeked = () => {
          isSeekingRef.current = false;
          if (video && Math.abs(video.currentTime - targetTimeRef.current) > 0.02) {
            applySeek();
          }
        };

        video.addEventListener('seeked', handleSeeked);

        const handleMouseMove = (e) => {
          if (prevXRef.current === null) {
            prevXRef.current = e.clientX;
            return;
          }
          const delta = e.clientX - prevXRef.current;
          prevXRef.current = e.clientX;

          if (!video.duration) return;

          const SENSITIVITY = 0.8;
          const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          targetTimeRef.current = Math.max(0, Math.min(video.duration, targetTimeRef.current + timeOffset));
          applySeek();
        };

        const handleMouseLeave = () => {
          prevXRef.current = null;
        };

        // Touch scrub support for mobile devices
        const handleTouchMove = (e) => {
          if (!e.touches || e.touches.length === 0) return;
          const clientX = e.touches[0].clientX;
          if (prevXRef.current === null) {
            prevXRef.current = clientX;
            return;
          }
          const delta = clientX - prevXRef.current;
          prevXRef.current = clientX;

          if (!video.duration) return;
          const SENSITIVITY = 0.9;
          const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          targetTimeRef.current = Math.max(0, Math.min(video.duration, targetTimeRef.current + timeOffset));
          applySeek();
        };

        const handleTouchEnd = () => {
          prevXRef.current = null;
        };

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleTouchEnd);

        return () => {
          video.removeEventListener('seeked', handleSeeked);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleTouchEnd);
        };
      }, []);

      return (
        <div className="relative w-full min-h-screen select-none overflow-hidden bg-black text-white">
          {/* Background Video (mouse-scrub controlled) */}
          <video
            ref={videoRef}
            className="bg-video-scrub"
            muted
            playsInline
            preload="auto"
            aria-hidden="true"
          >
            <source
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
              type="video/mp4"
            />
          </video>

          {/* NAVBAR (fixed, z-index: 10) */}
          <nav className="fixed top-0 left-0 right-0 w-full z-10 px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center">
            {/* Brand (left) */}
            <a href="index.html" className="flex items-center gap-2 text-white no-underline group cursor-pointer" title="Back to Platform">
              <span className="text-emerald-400 text-[22px]">✦</span>
              <span
                className="text-[20px] sm:text-[24px] tracking-tight text-white font-bold"
                style={{ fontFamily: 'var(--font-heading)' }}
              >
                Education Planning Platform
              </span>
            </a>

            {/* Back link */}
            <a
              href="index.html"
              className="text-[14px] sm:text-[16px] text-zinc-400 hover:text-white transition-colors"
            >
              ← Back to Portal
            </a>
          </nav>

          {/* HERO SECTION (z-index: 1) */}
          <section className="relative z-[1] w-full h-screen flex flex-col justify-end pb-16 sm:pb-20 md:justify-center md:pb-0 px-5 sm:px-8 md:px-12 overflow-hidden">
            <div className="max-w-2xl relative z-10">
              {/* Badge */}
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs sm:text-sm font-semibold tracking-wide uppercase mb-4 backdrop-blur-md">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Educational Planning Assistant
              </div>

              {/* Main Heading */}
              <h1 className="text-3xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight leading-[1.15] mb-4">
                Personalized Career &<br className="hidden sm:inline" /> Education Plan
              </h1>

              {/* Subtitle */}
              <p className="text-base sm:text-lg text-zinc-300 max-w-xl font-normal leading-relaxed mb-8">
                Build your structured roadmap: short-term objectives, accredited coursework, timeline milestones, prerequisite pathways, and financial ROI models.
              </p>

              {/* Dream Job Input & PLAN Button */}
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full max-w-xl mb-4">
                <div className="relative flex-1">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-400 text-lg">
                    💼
                  </div>
                  <input
                    type="text"
                    id="dream-job-input"
                    placeholder="Fill your dream job name (e.g. AI Engineer, Full Stack, Data Scientist)..."
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        const btn = document.getElementById('btn-plan-portal');
                        if (btn) btn.click();
                      }
                    }}
                    className="w-full pl-12 pr-4 py-4 rounded-full bg-zinc-900/90 border border-zinc-700/80 text-white placeholder-zinc-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 text-[14px] sm:text-[15px] transition-all shadow-inner"
                  />
                </div>
                <button
                  id="btn-plan-portal"
                  onClick={() => {
                    const inputEl = document.getElementById('dream-job-input');
                    const dreamJob = inputEl ? inputEl.value.trim() : '';
                    const targetUrl = dreamJob ? `plan.html?job=${encodeURIComponent(dreamJob)}` : 'plan.html';

                    const overlay = document.getElementById('plan-portal-anim');
                    if (overlay) {
                      overlay.style.display = 'flex';
                      overlay.style.opacity = '0';
                      requestAnimationFrame(() => {
                        overlay.style.transition = 'opacity 0.4s ease';
                        overlay.style.opacity = '1';
                        setTimeout(() => { window.location.href = targetUrl; }, 900);
                      });
                    } else {
                      window.location.href = targetUrl;
                    }
                  }}
                  className="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full text-black font-extrabold text-[16px] sm:text-[18px] tracking-wide cursor-pointer transition-all duration-300 group hover:scale-[1.04] active:scale-[0.98] whitespace-nowrap"
                  style={{background:'linear-gradient(135deg,#34d399,#38bdf8)',boxShadow:'0 0 35px rgba(52,211,153,0.5)'}}
                >
                  <span>✦ PLAN</span>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-black/15 text-black font-bold uppercase tracking-wider">Continue →</span>
                  <svg className="w-5 h-5 transition-transform duration-200 group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                  </svg>
                </button>
              </div>


            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Portal overlay for PLAN button transition -->
  <div id="plan-portal-anim" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:#000;flex-direction:column;gap:20px">
    <canvas id="edu-portal-canvas" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
    <div style="position:relative;z-index:2;text-align:center">
      <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:clamp(20px,4vw,40px);font-weight:900;background:linear-gradient(135deg,#34d399,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px">Entering Career Architect</div>
      <div style="color:#64748b;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600">Building your personalized roadmap...</div>
    </div>
  </div>
  <script>
    (function(){
      const overlay=document.getElementById('plan-portal-anim');
      const canvas=document.getElementById('edu-portal-canvas');
      if(!canvas)return;
      const ctx=canvas.getContext('2d');
      let W,H,pts=[],fr,running=false;
      function rsz(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
      rsz();window.addEventListener('resize',rsz);
      function initPts(){pts=[];for(let i=0;i<200;i++){const ang=Math.random()*Math.PI*2,r=60+Math.random()*Math.max(W,H)*.5;pts.push({angle:ang,radius:r,speed:(.012+Math.random()*.02)*(Math.random()>.5?1:-1),size:.5+Math.random()*2.5,opacity:.3+Math.random()*.7,hue:140+Math.random()*120})}}
      function draw(t0){
        if(!running)return;
        ctx.clearRect(0,0,W,H);
        const cx=W/2,cy=H/2,el=(Date.now()-t0)/1000;
        for(let r=30;r<Math.max(W,H)*.6;r+=30){ctx.beginPath();ctx.arc(cx,cy,r*(1+.03*Math.sin(el*3+r*.04)),0,Math.PI*2);ctx.strokeStyle='rgba(52,211,153,'+(Math.max(0,.08-r*.00006))+')';ctx.lineWidth=1;ctx.stroke()}
        pts.forEach(p=>{p.angle+=p.speed;const r=Math.max(5,p.radius-el*80),x=cx+r*Math.cos(p.angle),y=cy+r*Math.sin(p.angle);ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fillStyle='hsla('+p.hue+',80%,65%,'+(p.opacity*Math.min(1,r/60))+')';ctx.fill()});
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,150);g.addColorStop(0,'rgba(52,211,153,'+(0.35+.12*Math.sin(el*4))+')');g.addColorStop(.4,'rgba(56,189,248,0.12)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
        fr=requestAnimationFrame(()=>draw(t0))
      }
      const origBtn=document.getElementById('btn-plan-portal');
      if(origBtn){
        origBtn.addEventListener('click',()=>{
          running=true;initPts();
          overlay.style.display='flex';overlay.style.opacity='0';
          requestAnimationFrame(()=>{overlay.style.transition='opacity 0.35s ease';overlay.style.opacity='1'});
          draw(Date.now());
          const inputEl = document.getElementById('dream-job-input');
          const dreamJob = inputEl ? inputEl.value.trim() : '';
          const targetUrl = dreamJob ? `plan.html?job=${encodeURIComponent(dreamJob)}` : 'plan.html';
          setTimeout(()=>{window.location.href=targetUrl},1000)
        })
      }
    })()
  </script>
</body>
</html>
