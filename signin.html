<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Registration & Sign In — Firewall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4361EE;
      --blue-dark: #3451d1;
      --green: #22C55E;
      --green-dark: #16a34a;
      --white: #ffffff;
      --card-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.18);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--blue);
      -webkit-font-smoothing: antialiased;
    }

    /* ── BACKGROUND BLOBS ── */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #3451d1 0%, #4361EE 45%, #5b73f5 100%);
      overflow: hidden;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c9fff 0%, #4361EE 100%);
      top: -120px; right: -100px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #22C55E 0%, #16a34a 100%);
      bottom: -80px; left: -80px;
      opacity: 0.18;
      animation-delay: 3s;
    }

    .blob-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, #a78bfa 0%, #7c3aed 100%);
      top: 40%; left: 10%;
      opacity: 0.20;
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.04); }
    }

    /* ── PARTICLE DOTS ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-80px) rotate(720deg); opacity: 0; }
    }

    /* ── MAIN LAYOUT ── */
    .scene {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 0;
    }

    /* ── CHARACTER WRAPPER ── */
    .character-wrap {
      position: relative;
      width: 340px;
      min-height: 480px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: slideFromLeft 0.9s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideFromLeft {
      from { transform: translateX(-120px); opacity: 0; }
      to   { transform: translateX(0);      opacity: 1; }
    }

    /* SVG character */
    .character-svg {
      width: 100%;
      max-width: 300px;
      animation: characterWalk 0.9s cubic-bezier(.22,1,.36,1) 0.1s both;
      filter: drop-shadow(0 24px 32px rgba(0,0,0,0.35));
    }

    @keyframes characterWalk {
      from { transform: translateX(-60px) translateY(20px); opacity: 0; }
      to   { transform: translateX(0) translateY(0); opacity: 1; }
    }

    /* idle bob animation after entrance */
    .character-svg .body-group {
      transform-origin: 50% 90%;
      animation: idle-bob 3.5s ease-in-out 1.2s infinite;
    }

    @keyframes idle-bob {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-6px); }
    }

    /* Shadow under character */
    .char-shadow {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 22px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: shadow-pulse 3.5s ease-in-out 1.2s infinite;
    }

    @keyframes shadow-pulse {
      0%, 100% { transform: translateX(-50%) scaleX(1);   opacity: 0.7; }
      50%       { transform: translateX(-50%) scaleX(0.88); opacity: 0.5; }
    }

    /* ── REGISTRATION CARD ── */
    .card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      padding: 48px 44px 44px;
      width: 100%;
      max-width: 420px;
      animation: cardAppear 0.85s cubic-bezier(.22,1,.36,1) 0.3s both;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -2px; left: -2px; right: -2px;
      height: 4px;
      background: linear-gradient(90deg, var(--green) 0%, #86efac 50%, var(--green) 100%);
      border-radius: 24px 24px 0 0;
      background-size: 200% 100%;
      animation: shimmer-bar 2.5s linear 1.3s infinite;
    }

    @keyframes shimmer-bar {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes cardAppear {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    .card-header {
      margin-bottom: 32px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1.5px solid #bbf7d0;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    .card-tag svg { width: 12px; height: 12px; }

    .card-title {
      font-size: 30px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 14.5px;
      font-weight: 400;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── FORM INPUTS ── */
    .form-group {
      margin-bottom: 16px;
      animation: inputRise 0.7s cubic-bezier(.22,1,.36,1) both;
    }

    .form-group:nth-child(1) { animation-delay: 0.55s; }
    .form-group:nth-child(2) { animation-delay: 0.65s; }

    @keyframes inputRise {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.2s;
      display: flex;
    }

    .input-wrap:focus-within .input-icon {
      color: var(--blue);
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      height: 52px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #0f172a;
      padding: 0 16px 0 48px;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(67,97,238,0.12);
    }

    /* ── CTA BUTTON ── */
    .btn-register {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 56px;
      background: var(--green);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 28px;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 8px 24px rgba(34,197,94,0.4);
      animation: btnPop 0.7s cubic-bezier(.22,1,.36,1) 0.8s both;
    }

    @keyframes btnPop {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .btn-register::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
      border-radius: inherit;
    }

    .btn-register::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center, rgba(255,255,255,0.35) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .btn-register:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(34,197,94,0.5);
    }

    .btn-register:hover::after { opacity: 1; }

    .btn-register:active {
      transform: scale(0.97) translateY(0);
      box-shadow: 0 4px 12px rgba(34,197,94,0.3);
    }

    .btn-register svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
    }

    /* ── FOOTER NOTE ── */
    .card-foot {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      animation: inputRise 0.7s cubic-bezier(.22,1,.36,1) 0.9s both;
    }

    .card-foot a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .card-foot a:hover { text-decoration: underline; }

    /* ── BACK LINK ── */
    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 8px 18px 8px 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, color 0.2s, transform 0.2s;
      animation: rise 0.8s cubic-bezier(.22,1,.36,1) both;
    }

    .back-link:hover {
      background: rgba(255,255,255,0.22);
      color: #fff;
      transform: translateX(-3px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LIVE WEBINAR BADGE ── */
    .live-badge {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: rise 0.8s cubic-bezier(.22,1,.36,1) 0.1s both;
    }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22C55E;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.3);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.3); }
      50%       { box-shadow: 0 0 0 7px rgba(34,197,94,0.15); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 760px) {
      .scene {
        flex-direction: column;
        align-items: center;
        padding-top: 80px;
      }

      .character-wrap {
        width: 220px;
        min-height: 260px;
        margin-bottom: -20px;
      }

      .card {
        padding: 36px 28px 32px;
        max-width: 100%;
      }

      .card-title { font-size: 24px; }

      .back-link { top: 16px; left: 16px; font-size: 13px; padding: 6px 14px 6px 10px; }
      .live-badge { top: 16px; right: 16px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Back Button -->
  <a href="index.html" class="back-link" aria-label="Back to home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
    Back
  </a>

  <!-- Live Badge -->
  <div class="live-badge">
    <div class="live-dot"></div>
    Live Webinar
  </div>

  <!-- Scene: Character + Card -->
  <div class="scene">

    <!-- ─── 3D-STYLE SVG CHARACTER ─── -->
    <div class="character-wrap">
      <div class="char-shadow"></div>
      <svg class="character-svg" viewBox="0 0 280 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <!-- Skin gradient -->
          <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFD5A8"/>
            <stop offset="100%" stop-color="#F5B87A"/>
          </linearGradient>
          <!-- Hair gradient -->
          <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F5D16C"/>
            <stop offset="100%" stop-color="#D4A829"/>
          </linearGradient>
          <!-- Blazer gradient -->
          <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#EDE8DE"/>
            <stop offset="100%" stop-color="#C8C0A8"/>
          </linearGradient>
          <!-- Pants gradient -->
          <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4A4A55"/>
            <stop offset="100%" stop-color="#2E2E38"/>
          </linearGradient>
          <!-- Shoe gradient -->
          <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#555568"/>
            <stop offset="100%" stop-color="#1a1a2e"/>
          </linearGradient>
          <!-- Briefcase gradient -->
          <linearGradient id="briefcase" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#A0855A"/>
            <stop offset="100%" stop-color="#6B5030"/>
          </linearGradient>
          <!-- Shirt -->
          <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0f0f0"/>
            <stop offset="100%" stop-color="#d8d8d8"/>
          </linearGradient>
          <!-- Glasses -->
          <filter id="shadow-sm">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/>
          </filter>
        </defs>

        <!-- All animating parts as a group -->
        <g class="body-group">

          <!-- ── SHOES ── -->
          <!-- Left shoe -->
          <ellipse cx="103" cy="454" rx="32" ry="11" fill="url(#shoe)"/>
          <rect x="71" y="440" width="55" height="18" rx="9" fill="url(#shoe)"/>
          <!-- sole highlight -->
          <rect x="72" y="440" width="53" height="5" rx="5" fill="rgba(255,255,255,0.12)"/>

          <!-- Right shoe -->
          <ellipse cx="185" cy="454" rx="32" ry="11" fill="url(#shoe)"/>
          <rect x="158" y="440" width="55" height="18" rx="9" fill="url(#shoe)"/>
          <rect x="159" y="440" width="53" height="5" rx="5" fill="rgba(255,255,255,0.12)"/>

          <!-- ── PANTS ── -->
          <!-- Left leg -->
          <rect x="80" y="310" width="58" height="140" rx="12" fill="url(#pants)"/>
          <!-- Right leg -->
          <rect x="150" y="310" width="58" height="140" rx="12" fill="url(#pants)"/>
          <!-- Crease detail -->
          <line x1="109" y1="320" x2="109" y2="445" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
          <line x1="179" y1="320" x2="179" y2="445" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>

          <!-- ── TORSO / BLAZER ── -->
          <rect x="70" y="190" width="148" height="135" rx="18" fill="url(#blazer)" filter="url(#shadow-sm)"/>
          <!-- Blazer lapels -->
          <path d="M144 195 L122 240 L144 248 Z" fill="rgba(180,170,150,0.6)"/>
          <path d="M144 195 L166 240 L144 248 Z" fill="rgba(200,190,165,0.6)"/>
          <!-- Shirt collar -->
          <rect x="132" y="193" width="24" height="36" rx="4" fill="url(#shirt)"/>
          <!-- Tie -->
          <path d="M144 200 L148 228 L144 238 L140 228 Z" fill="#4361EE" opacity="0.85"/>
          <path d="M144 196 L150 200 L144 210 L138 200 Z" fill="#3451d1" opacity="0.85"/>
          <!-- Blazer pocket -->
          <rect x="85" y="240" width="30" height="20" rx="5" fill="rgba(180,165,140,0.45)" stroke="rgba(180,165,140,0.6)" stroke-width="1"/>
          <!-- Pocket square -->
          <path d="M88 241 L97 241 L97 248" fill="none" stroke="#4361EE" stroke-width="2" stroke-linecap="round"/>
          <!-- Buttons -->
          <circle cx="144" cy="268" r="3.5" fill="rgba(120,110,90,0.5)"/>
          <circle cx="144" cy="284" r="3.5" fill="rgba(120,110,90,0.5)"/>

          <!-- ── ARMS ── -->
          <!-- Right arm (holding briefcase, down) -->
          <rect x="218" y="196" width="36" height="110" rx="18" fill="url(#blazer)"/>
          <!-- Right forearm / hand -->
          <ellipse cx="236" cy="308" rx="14" ry="18" fill="url(#skin)"/>

          <!-- Left arm (crossed) -->
          <rect x="34" y="196" width="36" height="100" rx="18" fill="url(#blazer)"/>
          <!-- Left hand -->
          <ellipse cx="52" cy="298" rx="14" ry="18" fill="url(#skin)"/>

          <!-- Arms-crossed detail — right arm over left -->
          <!-- Right arm crossing bar -->
          <rect x="68" y="238" width="100" height="34" rx="17" fill="url(#blazer)"/>
          <!-- Left arm crossing bar -->
          <rect x="120" y="248" width="100" height="32" rx="16" fill="url(#blazer)" opacity="0.92"/>
          <!-- Cuff details -->
          <rect x="68" y="245" width="24" height="10" rx="5" fill="rgba(220,215,200,0.8)"/>
          <rect x="196" y="249" width="24" height="10" rx="5" fill="rgba(220,215,200,0.8)"/>

          <!-- ── NECK ── -->
          <rect x="129" y="162" width="30" height="36" rx="10" fill="url(#skin)"/>

          <!-- ── HEAD ── -->
          <!-- Head shape -->
          <ellipse cx="144" cy="126" rx="60" ry="70" fill="url(#skin)"/>
          <!-- Ear left -->
          <ellipse cx="85" cy="126" rx="10" ry="14" fill="url(#skin)"/>
          <ellipse cx="86" cy="126" rx="5" ry="8" fill="#F0A870" opacity="0.4"/>
          <!-- Ear right -->
          <ellipse cx="203" cy="126" rx="10" ry="14" fill="url(#skin)"/>
          <ellipse cx="202" cy="126" rx="5" ry="8" fill="#F0A870" opacity="0.4"/>

          <!-- ── HAIR ── -->
          <!-- Main hair mass -->
          <ellipse cx="144" cy="73" rx="60" ry="38" fill="url(#hair)"/>
          <!-- Hair front fringe -->
          <path d="M84 80 Q100 48 144 50 Q188 48 204 80 Q185 66 162 68 Q144 60 126 68 Q103 66 84 80Z" fill="#E8C435"/>
          <!-- Hair side -->
          <ellipse cx="90" cy="100" rx="12" ry="20" fill="url(#hair)"/>
          <ellipse cx="198" cy="100" rx="12" ry="20" fill="url(#hair)"/>

          <!-- ── FACE ── -->
          <!-- Eyes -->
          <ellipse cx="120" cy="124" rx="14" ry="15" fill="white"/>
          <ellipse cx="168" cy="124" rx="14" ry="15" fill="white"/>
          <!-- Iris -->
          <circle cx="120" cy="126" r="8" fill="#3B2A1A"/>
          <circle cx="168" cy="126" r="8" fill="#3B2A1A"/>
          <!-- Pupils -->
          <circle cx="121" cy="125" r="4.5" fill="#1a1008"/>
          <circle cx="169" cy="125" r="4.5" fill="#1a1008"/>
          <!-- Eye shine -->
          <circle cx="123" cy="122" r="2.2" fill="white"/>
          <circle cx="171" cy="122" r="2.2" fill="white"/>

          <!-- ── GLASSES ── -->
          <!-- Left frame -->
          <rect x="102" y="113" width="34" height="24" rx="8" fill="none" stroke="#3a3a3a" stroke-width="3"/>
          <!-- Right frame -->
          <rect x="152" y="113" width="34" height="24" rx="8" fill="none" stroke="#3a3a3a" stroke-width="3"/>
          <!-- Bridge -->
          <line x1="136" y1="125" x2="152" y2="125" stroke="#3a3a3a" stroke-width="2.5"/>
          <!-- Left arm -->
          <line x1="102" y1="125" x2="84" y2="120" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Right arm -->
          <line x1="186" y1="125" x2="204" y2="120" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Lens tint -->
          <rect x="104" y="115" width="30" height="20" rx="7" fill="rgba(67,97,238,0.08)"/>
          <rect x="154" y="115" width="30" height="20" rx="7" fill="rgba(67,97,238,0.08)"/>

          <!-- ── EYEBROWS ── -->
          <path d="M104 110 Q120 103 135 108" stroke="#C4991A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M152 108 Q167 103 183 110" stroke="#C4991A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

          <!-- ── MOUTH / SMILE ── -->
          <path d="M128 152 Q144 165 160 152" stroke="#D4956A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Cheeks blush -->
          <ellipse cx="100" cy="143" rx="14" ry="8" fill="#FFB4A0" opacity="0.28"/>
          <ellipse cx="188" cy="143" rx="14" ry="8" fill="#FFB4A0" opacity="0.28"/>

          <!-- ── BRIEFCASE (on ground to right) ── -->
          <g transform="translate(200, 370)">
            <!-- Body -->
            <rect x="0" y="12" width="72" height="52" rx="8" fill="url(#briefcase)" filter="url(#shadow-sm)"/>
            <!-- Handle -->
            <path d="M22 12 Q22 0 50 0 Q78 0 78 12" fill="none" stroke="#6B5030" stroke-width="4.5" stroke-linecap="round"/>
            <!-- Handle inner cut -->
            <path d="M26 12 Q26 4 50 4 Q74 4 74 12" fill="none" stroke="#A0855A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            <!-- Center clasp -->
            <rect x="30" y="32" width="12" height="10" rx="4" fill="#C4973A"/>
            <rect x="31" y="34" width="10" height="7" rx="3" fill="#DAAB42"/>
            <!-- Horizontal seam -->
            <line x1="0" y1="38" x2="72" y2="38" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
            <!-- Stitching top -->
            <path d="M6 16 Q36 14 66 16" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- Corner rivets -->
            <circle cx="10" cy="20" r="3" fill="#C4973A"/>
            <circle cx="62" cy="20" r="3" fill="#C4973A"/>
            <circle cx="10" cy="56" r="3" fill="#C4973A"/>
            <circle cx="62" cy="56" r="3" fill="#C4973A"/>
            <!-- Shadow -->
            <ellipse cx="36" cy="68" rx="38" ry="7" fill="rgba(0,0,0,0.22)"/>
          </g>

        </g><!-- end .body-group -->
      </svg>
    </div>

    <!-- ─── REGISTRATION CARD ─── -->
    <div class="card" role="main">
      <div class="card-header">
        <div class="card-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Free Registration
        </div>
        <h1 class="card-title">Register now</h1>
        <p class="card-subtitle">Secure your spot in our upcoming live webinar.</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="What's your name?"
              autocomplete="given-name"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Choose password (min 6 chars)"
              autocomplete="current-password"
              required
              minlength="6"
            >
          </div>
        </div>

        <div id="signin-error" style="color: #ef4444; font-size: 13px; margin: 10px 0; display: none; line-height: 1.4; text-align: center;"></div>

        <button type="submit" class="btn-register" id="submit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.06a16 16 0 0 0 5.86 5.86l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 15v2z"/>
          </svg>
          Register & Sign In
        </button>
      </form>

      <p class="card-foot">
        Already registered? <a href="index.html">Return home</a>
      </p>
    </div>

  </div><!-- end .scene -->

  <!-- Firebase Modular SDK v10 Bridge -->
  <script type="module" src="firebase-bridge.js"></script>

  <script>
    // ── Particle generator ──
    (function () {
      const container = document.getElementById('particles');
      if (!container) return;
      const COUNT = 22;
      for (let i = 0; i < COUNT; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 5 + 3;
        p.style.cssText = [
          `width:${size}px`,
          `height:${size}px`,
          `left:${Math.random() * 100}%`,
          `bottom:-20px`,
          `opacity:${Math.random() * 0.5 + 0.3}`,
          `animation-duration:${Math.random() * 14 + 10}s`,
          `animation-delay:${Math.random() * 12}s`,
        ].join(';');
        container.appendChild(p);
      }
    })();

    // ── Form submit with real Firebase Authentication ──
    (function () {
      const form = document.getElementById('register-form');
      const btn  = document.getElementById('submit-btn');
      const errBox = document.getElementById('signin-error');

      if (!form || !btn) return;

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const name  = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (errBox) errBox.style.display = 'none';

        if (!name || !email || !password) {
          [document.getElementById('name'), document.getElementById('email'), document.getElementById('password')].forEach(function (el) {
            if (el && !el.value.trim()) {
              el.style.borderColor = '#ef4444';
              el.style.animation = 'none';
              el.offsetHeight;
              el.style.animation = 'shake 0.4s ease';
              setTimeout(function() { el.style.borderColor = ''; el.style.animation = ''; }, 800);
            }
          });
          return;
        }

        const originalBtnHTML = btn.innerHTML;
        btn.innerHTML = '<svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Connecting to Firebase...';
        btn.disabled = true;

        try {
          if (!window.FirebaseBridge) {
            throw new Error('Firebase SDK initializing. Please wait a moment and retry.');
          }

          // Attempt Sign Up first
          let res = await window.FirebaseBridge.signUpWithEmail(email, password, name);

          // If email already exists, attempt Sign In
          if (!res.success && res.error && res.error.includes('already exists')) {
            btn.innerHTML = 'Signing In...';
            res = await window.FirebaseBridge.signInWithEmail(email, password);
          }

          if (res.success) {
            btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Authenticated!';
            btn.style.background = '#16a34a';
            form.querySelectorAll('input').forEach(function(i){ i.disabled = true; });

            try {
              sessionStorage.setItem('firewall_just_logged_in', 'true');
              localStorage.setItem('firewall_signed_in', 'true');
            } catch (e) {}

            setTimeout(function () {
              window.location.href = 'index.html?signed_in=true';
            }, 900);
          } else {
            throw new Error(res.error || 'Authentication error.');
          }
        } catch (err) {
          if (errBox) {
            errBox.textContent = err.message || 'Authentication error occurred.';
            errBox.style.display = 'block';
          }
          btn.innerHTML = originalBtnHTML;
          btn.disabled = false;
        }
      });
    })();
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      40%  { transform: translateX(6px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
    }

    .spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

</body>
